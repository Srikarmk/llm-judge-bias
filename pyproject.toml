[project]
name = "llm-judge-bias"
version = "0.1.0"
description = "Does an LLM judge's verdict depend on things that should not matter? Position, length, tone, formatting and authorship, measured on pairs with a known better answer."
readme = "README.md"
license = "MIT"
authors = [{ name = "Kameswara Sai Srikar Manda" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=15",
    "matplotlib>=3.8",
]

[project.scripts]
judgebias = "judgebias.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/judgebias"]

[tool.pytest.ini_options]
testpaths = ["tests"]
